<html lang="en">
<head>
    <link rel="stylesheet" href="style.css"> 
    <title>Patient Intake - Siddiqui Clinic</title>
</head>  
<body>
<header>
    <table width="100%">
        <tr>
            <td valign="top" align="left" width="20%">
                <div class="image">
                    <img align="center" src="SiddiquiClinic.png" alt="Siddiqui Clinic Logo" width="200px" id="logo"/>
                </div>
            </td>
            <td>
                <h2>Siddiqui Clinic</h2>
            </td>
            <td valign="bottom" align="right" width="20%">
                <p>Today's Date: <span id="today"></span></p>
            </td>
        </tr>
    </table>
</header>
<hr>

<form action="thankyou.html" id="signup" onsubmit="return validateForm()">
    <center>
        <div class="format">
            <table>
                <tr>
                    <th colspan="6">Create Account</th>
                </tr>
                <tr>
                    <td class="td1"><label for="fname">First Name:</label></td>
                    <td>
                        <input type="text" name="fname" id="fname" minlength="1" maxlength="30" required 
                               title="Letters, apostrophes, and dashes only" 
                               pattern="[a-zA-Z'-]{1,30}" onblur="validateFname()" placeholder="Your First Name"/>
                        <span class="error" id="fname-error"></span>
                    </td>
                    <td class="td1"><label for="minit">Middle Initial:</label></td>
                    <td>
                        <input type="text" name="minit" id="minit" maxlength="1" 
                               title="Letters only" pattern="[a-zA-Z]{0,1}" onblur="validateMinit()" placeholder="M.I."/>
                        <span class="error" id="minit-error"></span>
                    </td>
                    <td class="td1"><label for="lname">Last Name:</label></td>
                    <td>
                        <input type="text" name="lname" id="lname" minlength="1" maxlength="30" required 
                               title="Letters, apostrophes, numbers 2-5, and dashes only" 
                               pattern="[a-zA-Z'2-5-]{1,30}" onblur="validateLname()" placeholder="Your Last Name"/>
                        <span class="error" id="lname-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="pgender">Gender:</label></td>
                    <td>
                        <input type="radio" id="g1" name="pgender" value="Male"> Male
                        <input type="radio" id="g2" name="pgender" value="Female"> Female
                        <input type="radio" id="g3" name="pgender" value="Other" required> Other
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" name="dob" required onblur="validateDob()"/>
                        <span class="error" id="dob-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="ssn">Social Security Number:</label></td>
                    <td>
                        <input type="password" name="ssn" id="ssn" minlength="9" maxlength="11" required 
                               title="Numbers and dashes only" placeholder="000-00-0000" pattern="^\d{3}-?\d{2}-?\d{4}$" onblur="validateSsn()"/>
                        <span class="error" id="ssn-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="phone">Phone Number:</label></td>
                    <td>
                        <input type="text" name="phone" id="phone" required title="Format: 000-000-0000" 
                               pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" onblur="validatePhone()" placeholder="123-456-7890"/>
                        <span class="error" id="phone-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="address1">Address Line 1:</label></td>
                    <td>
                        <input type="text" name="address1" id="address1" minlength="2" maxlength="30" required 
                               title="Please enter your address" placeholder="1234 Address"/>
                        <span class="error" id="address1-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="address2">Address Line 2:</label></td>
                    <td>
                        <input type="text" name="address2" id="address2" minlength="2" maxlength="30" 
                               title="Apt, Suite, etc." placeholder="Building 1, Apt 2, etc."/>
                        <span class="error" id="address2-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="city">City:</label></td>
                    <td><input type="text" name="city" id="city" maxlength="30" placeholder="City" required/></td>
                    <td class="td1"><label for="state">State:</label></td>
                    <td>
                        <select name="state" id="state" required>
                           <option value="" selected disabled>Please Select One</option>
                           <option value="AL">Alabama</option>
                           <option value="AK">Alaska</option>
                           <option value="AZ">Arizona</option>
                           <option value="AR">Arkansas</option>
                           <option value="CA">California</option>
                           <option value="CO">Colorado</option>
                           <option value="CT">Connecticut</option>
                           <option value="DE">Delaware</option>
                           <option value="DC">District of Columbia</option>
                           <option value="FL">Florida</option>
                           <option value="GA">Georgia</option>
                           <option value="HI">Hawaii</option>
                           <option value="ID">Idaho</option>
                           <option value="IL">Illinois</option>
                           <option value="IN">Indiana</option>
                           <option value="IA">Iowa</option>
                           <option value="KS">Kansas</option>
                           <option value="KY">Kentucky</option>
                           <option value="LA">Louisiana</option>
                           <option value="ME">Maine</option>
                           <option value="MD">Maryland</option>
                           <option value="MA">Massachusetts</option>
                           <option value="MI">Michigan</option>
                           <option value="MN">Minnesota</option>
                           <option value="MS">Mississippi</option>
                           <option value="MO">Missouri</option>
                           <option value="MT">Montana</option>
                           <option value="NE">Nebraska</option>
                           <option value="NV">Nevada</option>
                           <option value="NH">New Hampshire</option>
                           <option value="NJ">New Jersey</option>
                           <option value="NM">New Mexico</option>
                           <option value="NY">New York</option>
                           <option value="NC">North Carolina</option>
                           <option value="ND">North Dakota</option>
                           <option value="OH">Ohio</option>
                           <option value="OK">Oklahoma</option>
                           <option value="OR">Oregon</option>
                           <option value="PA">Pennsylvania</option>
                           <option value="PR">Puerto Rico</option>
                           <option value="RI">Rhode Island</option>
                           <option value="SC">South Carolina</option>
                           <option value="SD">South Dakota</option>
                           <option value="TN">Tennessee</option>
                           <option value="TX">Texas</option>
                           <option value="UT">Utah</option>
                           <option value="VT">Vermont</option>
                           <option value="VA">Virginia</option>
                           <option value="WA">Washington</option>
                           <option value="WV">West Virginia</option>
                           <option value="WI">Wisconsin</option>
                           <option value="WY">Wyoming</option>
                        </select>
                    </td>
                    <td class="td1"><label for="zcode">Zip Code:</label></td> 
                    <td> 
                        <input type="text" id="zcode" name="zcode" minlength="5" maxlength="10" required 
                               title="Numbers and a dash only" pattern="^\d{5}(-\d{4})?$" onblur="validateZcode()" placeholder="12345"/>
                        <span class="error" id="zcode-error"></span> 
                    </td> 
                </tr>
                <tr>
                    <td class="td1"><label>Medical History:</label></td>
                    <td>
                        <input type="checkbox" name="history" value="Chicken Pox"> Chicken Pox <br>
                        <input type="checkbox" name="history" value="Measles"> Measles <br>
                        <input type="checkbox" name="history" value="COVID-19"> COVID-19 <br>
                        <input type="checkbox" name="history" value="Small Pox"> Small Pox <br>
                        <input type="checkbox" name="history" value="Tetanus"> Tetanus
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="vaccinated">Fully Vaccinated?</label></td>
                    <td>
                        <input type="radio" name="vaccinated" value="Yes"> Yes
                        <input type="radio" name="vaccinated" value="No"> No
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="range">Current Health Rating (1-10):</label></td>
                    <td>
                        <input type="range" name="range" id="range" min="1" max="10" value="1"/>
                        <span id="range-slider"></span>
                    </td>
                </tr>
                <tr>
    <td class="td1"><label for="symptoms">Describe Symptoms:</label></td>
    <td colspan="3">
        <textarea name="symptoms" id="symptoms" rows="3" cols="40" 
                  title="Optional: Describe any symptoms or medical concerns" 
                  placeholder="Enter details here..."></textarea>
    </td>
</tr>
                <tr>
                    <td class="td1"><label for="email">Email Address:</label></td>
                    <td>
                        <input type="email" name="email" id="email" required 
                               title="Example: name@domain.com" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,20}$" 
                               onblur="validateEmail()" placeholder="yourname@example.com"/>
                        <span class="error" id="email-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="uid">User ID:</label></td>
                    <td>
                        <input type="text" name="uid" id="uid" minlength="5" maxlength="30" required 
                               title="5-30 chars, no spaces, letters/numbers/underscores only (cannot start with a number)" 
                               pattern="^[a-zA-Z][a-zA-Z0-9_-]{4,29}$" onblur="validateUid()" placeholder="Your user ID"/>
                        <span class="error" id="uid-error"></span>
                    </td>
                </tr>
                <tr>
                    <td class="td1"><label for="pword">Password:</label></td>
                    <td>
                        <input type="password" name="pword" id="pword" minlength="8" maxlength="30" required 
                               title="8-30 characters, 1 uppercase, 1 number, 1 special character" 
                               onblur="validatePword()" oninput="validatePword()" onfocus="validatePword()"/>
                    </td>
                </tr>
<tr>
    <td class="td1"><label for="repword">Re-enter Password:</label></td>
    <td colspan="4"> <input type="password" name="repword" id="repword" required 
               onblur="confirmRepword()" oninput="confirmRepword()" onfocus="confirmRepword()"/>
        <br>
        <span class="error" id="repword-error"></span> </td>
</tr>  

<tr>
    <td colspan="6">
        <div class="pword-message"></div>
    </td>
</tr>

<tr>
    <td colspan="6" class="button-row">
        <input type="submit" value="Submit" title="Click to submit your form">
        <input type="reset" value="Reset" onclick="removeReview()" title="Click to clear the form">
        <input type="button" name="review" id="review" value="Review" onclick="reviewInput()" title="Click to review your data below"/>
    </td>
</tr>

<tr>
    <td colspan="6">
        <div id="showInput"></div>
    </td>
</tr>
            </table> 
        </div> 
    </center> 
</form>

<footer> 
    <p>&#169; Siddiqui Clinic | <a href="contact.html">Contact Us!</a></p> 
</footer> 
<script src="hw2.js"></script> 
</body> 
</html>
